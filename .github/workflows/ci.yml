name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Include the ref so concurrent PRs don't cancel each other, but pushes
  # to the same ref still cancel in-progress runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: a floating tag would fail CI whenever a new
      # release learns new typos. Allow-list lives in `_typos.toml`.
      - name: Spell check
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  # Every check is a `nix run .#<check>` app defined in flake.nix, so hosted
  # CI and `nix run .#ci` locally execute byte-identical commands.
  checks:
    name: ${{ matrix.check }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        check:
          [
            ci-fmt,
            ci-clippy,
            ci-test,
            ci-doc,
            ci-no-std,
            ci-wasm,
            ci-msrv,
          ]
        include:
          # Host tests on darwin too: catches platform-specific codegen or
          # intrinsics differences in the tier dispatch.
          - os: macos-latest
            check: ci-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          name: inkandswitch
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: ${{ matrix.check }}
        run: nix run .#${{ matrix.check }}

  # The dev shell is what contributors use; make sure it still builds
  # (it pulls in tools the check apps don't, e.g. wasm-bodge, gungraun).
  devshell:
    name: nix develop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          name: inkandswitch
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build dev shell
        run: nix develop --command true

  # Mutation testing, scoped to the PR's changed code (`mutants.yml` does
  # the full sweep nightly). A missed mutant in code you touched fails the
  # job.
  mutants:
    name: ci-mutants (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the merge-base with the target branch exists.
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Diff against the merge base
        run: git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff

      - name: ci-mutants
        run: nix run .#ci-mutants -- --in-diff pr.diff

      # mutants.out holds the missed/caught/timeout lists and per-mutant
      # logs — the thing to read when the job goes red.
      - name: Upload mutants report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-report
          path: mutants.out
          if-no-files-found: ignore
