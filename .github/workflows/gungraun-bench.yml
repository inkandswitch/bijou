name: Gungraun Benchmarks

on:
  push:
    branches:
      - main
    paths:
      - "bijou64/**"
      - ".github/workflows/gungraun-bench.yml"
  pull_request:
    paths:
      - "bijou64/**"
      - ".github/workflows/gungraun-bench.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gungraun:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Install gungraun-runner
        run: |
          version=$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "bijou64") | .dependencies[] | select(.name == "gungraun") | .req')
          cargo install gungraun-runner --version "${version}"

      - name: Run gungraun benchmarks
        run: cargo bench -p bijou64 --bench gungraun_shootout

      - name: Upload gungraun results
        uses: actions/upload-artifact@v4
        with:
          name: gungraun-results-${{ github.sha }}
          path: target/gungraun/
          retention-days: 90
