name: Test Wasm

# Three layers of wasm coverage, each run for every wasm crate in the
# workspace (bijoux_wasm — all widths in one crate):
#
# 1. `wasm-pack test --node` exercises the Rust ↔ wasm-bindgen boundary
#    on the wasm32-unknown-unknown target inside Node.js. Fast, no
#    browser dependencies.
#
# 2. Mocha tests (`test:js:node`) exercise the wasm-bodge `dist/` output
#    through the `package.json` `node` exports condition. Catches build
#    output regressions that Rust-side tests can't see (e.g. CJS shim,
#    `fs.readFileSync` wasm-loading path).
#
# 3. Playwright tests (`test:js:browser`) exercise the same `dist/`
#    output through the `browser` exports condition across chromium /
#    firefox / webkit. Catches BigInt edge cases, base64 wasm init,
#    and engine-specific TypedArray behaviour.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast Rust-side integration tests on wasm32 in Node.js.
  # macOS included so we catch any darwin-specific wasm-bindgen quirks.
  # Single wasm crate (bijoux_wasm) carrying all three widths.
  wasm-pack-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        crate: [bijoux_wasm]

    name: wasm-pack test ${{ matrix.crate }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: true

      - name: Install wasm-pack
        # Pinned prebuilt via taiki-e/install-action instead of
        # `curl ... | sh` from rustwasm.github.io: deterministic version,
        # no opaque shell script, ~5s vs ~60s cargo build.
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - name: wasm-pack test --node ${{ matrix.crate }}
        run: wasm-pack test --node ${{ matrix.crate }}

  # JS-package tests against the wasm-bodge `dist/` output: Mocha
  # exercises the Node entrypoint; Playwright exercises the browser
  # entrypoint across chromium / firefox / webkit. Linux only — macOS
  # Playwright runs work but are slow and the bug surface is similar
  # enough that ubuntu-latest suffices for CI.
  #
  # Single wasm crate (bijoux_wasm): one `package.json`, one `dist/`,
  # one Playwright config covering all three widths.
  js-package:
    strategy:
      fail-fast: false
      matrix:
        crate: [bijoux_wasm]

    name: JS-package tests ${{ matrix.crate }}
    runs-on: ubuntu-latest
    env:
      # Force playwright to test all three engines on CI.
      PLAYWRIGHT_INCLUDE_WEBKIT: "1"

    steps:
      - uses: actions/checkout@v4

      # Pin Node + pnpm BEFORE any step that calls into them, so esbuild
      # (installed globally) and wasm-bodge (which spawns esbuild during
      # post-processing) run under the version we control rather than
      # whichever Node/npm happens to be preinstalled on the runner.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: ${{ matrix.crate }}/pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: true

      - name: Install nightly toolchain (panic=unwind builds)
        # wasm-bodge's default panic=unwind mode rebuilds std via
        # -Zbuild-std, which needs `cargo +nightly` with rust-src.
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Install wasm-bindgen-cli (must match workspace pin)
        run: cargo install --locked wasm-bindgen-cli@0.2.127

      - name: Install wasm-opt (binaryen)
        # wasm-bodge invokes bare `wasm-opt -O4`, but rustc's wasm output
        # uses bulk-memory (stable default since 1.87) and, for
        # panic=unwind builds, legacy exception handling with externref
        # tag params. Wrap wasm-opt to enable exactly those features
        # (validation only; -O4 introduces nothing the module doesn't
        # already use). Mirrors `wasm-opt-shim` in flake.nix — keep the
        # flag lists in sync.
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          mkdir -p "$HOME/.local/wasm-opt-shim"
          cat > "$HOME/.local/wasm-opt-shim/wasm-opt" <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/wasm-opt \
            --enable-bulk-memory \
            --enable-exception-handling \
            --enable-nontrapping-float-to-int \
            --enable-reference-types \
            "$@"
          EOF
          chmod +x "$HOME/.local/wasm-opt-shim/wasm-opt"
          echo "$HOME/.local/wasm-opt-shim" >> "$GITHUB_PATH"

      - name: Install esbuild (under the pinned Node)
        # Pinned to the version `pkgs.esbuild` provides in the Nix dev
        # shell, so CI and local runs invoke byte-identical bundler
        # behaviour. Bump in lockstep with `nixpkgs` if updating either.
        run: npm install -g esbuild@0.25.5

      - name: Install wasm-bodge
        # wasm-bodge isn't on a package registry; we build it from source
        # at the same commit the flake pins. Keep this in sync with
        # `flake.lock`'s wasm-bodge-src node.
        run: |
          cargo install --git https://github.com/alexjg/wasm-bodge \
            --rev ee3bca139cea45a38aab78a2f2fcc136432ce25f \
            --locked

      - name: Build ${{ matrix.crate }} with wasm-bodge
        working-directory: ${{ matrix.crate }}
        run: wasm-bodge build

      - name: Install JS dependencies
        working-directory: ${{ matrix.crate }}
        run: pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: playwright-version
        working-directory: ${{ matrix.crate }}
        run: |
          version=$(pnpm list @playwright/test --json | \
            jq -r '.[0].devDependencies["@playwright/test"].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.crate }}
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ${{ matrix.crate }}
        run: pnpm exec playwright install-deps

      - name: Run Node JS-package tests (Mocha)
        working-directory: ${{ matrix.crate }}
        run: pnpm run test:js:node

      - name: Run browser JS-package tests (Playwright)
        working-directory: ${{ matrix.crate }}
        run: pnpm run test:js:browser

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.crate }}
          path: ${{ matrix.crate }}/playwright-report/
          retention-days: 7
