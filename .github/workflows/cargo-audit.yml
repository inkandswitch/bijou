name: Audit Dependencies

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cargo-audit.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/audit.toml'
  pull_request:
    paths:
      - '.github/workflows/cargo-audit.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/audit.toml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1
        name: Audit Rust Dependencies
        with:
          # Suppress GitHub issue filing for advisories also listed in
          # audit.toml. The `audit.toml` ignore stops `cargo audit` from
          # failing the job, but this wrapper's issue-creation path is
          # separate and only consults its own `ignore` input. Keep this
          # list in sync with `[advisories].ignore` in `audit.toml`.
          ignore: RUSTSEC-2025-0141
