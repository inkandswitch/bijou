name: Bolero Property Tests

# Tiered sweeps of the same `ci-bolero` app CI and `test:props` run locally;
# only BOLERO_RANDOM_ITERATIONS differs.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  property-tests:
    name: ${{ matrix.label }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            iterations: 1000000 # 1M
            label: Quick
          - os: ubuntu-latest
            iterations: 10000000 # 10M
            label: Thorough
          - os: macos-latest
            iterations: 1000000 # 1M
            label: Quick
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          name: inkandswitch
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: ci-bolero (${{ matrix.iterations }} iterations)
        env:
          BOLERO_RANDOM_ITERATIONS: ${{ matrix.iterations }}
        run: nix run .#ci-bolero

  # 100M iterations (~10 min): main only, not worth blocking PRs on.
  property-tests-intense:
    name: Intense (ubuntu-latest)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          name: inkandswitch
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: ci-bolero (100000000 iterations)
        env:
          BOLERO_RANDOM_ITERATIONS: 100000000
        run: nix run .#ci-bolero
