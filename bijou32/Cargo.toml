[package]
name = "bijou32"
version = "0.1.1"
description = "DEPRECATED: moved into the bijoux crate — Bijective variable-length encoding for unsigned 32-bit integers"

categories = ["encoding", "no-std"]
keywords = ["varint", "variable-length", "canonical", "bijective"]
readme = "./README.md"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true, features = ["derive"] }
bolero = { workspace = true, optional = true, features = ["arbitrary"] }
thiserror = { workspace = true }

[dev-dependencies]
arbitrary = { workspace = true, optional = false, features = ["derive"] }
bijou32 = { path = ".", features = ["bolero"] }
bolero = { workspace = true, features = ["arbitrary"] }
testresult = { workspace = true }

[features]
default = []
arbitrary = ["dep:arbitrary"]
bolero = ["dep:bolero", "arbitrary"]

[lints]
workspace = true
