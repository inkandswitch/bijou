[package]
name = "bijou64_wasm"
version = "0.1.0"
description = "Wasm/JavaScript bindings for bijou64 (bijective varint encoding for u64)"

categories = ["encoding", "wasm", "web-programming"]
keywords = ["bijective", "canonical", "varint", "variable-length", "wasm"]
readme = "./README.md"
publish = false

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bijou64 = { workspace = true }
js-sys = { workspace = true }
thiserror = { workspace = true }
wasm-bindgen = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[features]
# `std` is on by default because the JS glue (`wasm-bindgen`, `js-sys`)
# is not realistically `no_std` in practice and the `cdylib` crate-type
# requires a global allocator + panic handler. `bijou64` itself is
# unconditionally `no_std + alloc`, so embedded callers should depend on
# it directly rather than going through this crate.
default = ["std"]
std = [
  "js-sys/std",
  "thiserror/std",
  "wasm-bindgen/std",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-multivalue",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-reference-types",
  "--enable-sign-ext",
  "--enable-simd",
]

[lints]
workspace = true
