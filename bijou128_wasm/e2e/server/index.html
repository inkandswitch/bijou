<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bijou128 Wasm Test</title>
  </head>
  <body>
    <div id="status">loading…</div>

    <!--
      Load the wasm-bodge "web" entry point. It auto-initialises by
      decoding the base64-embedded wasm in `wasm-base64.js`, so no
      explicit fetch / `init()` call is required.
    -->
    <script type="module">
      import * as bijou128 from "../../dist/esm/web.js";
      window.bijou128 = bijou128;
      window.bijou128Ready = true;
      document.getElementById("status").textContent = "ready";
    </script>
  </body>
</html>
