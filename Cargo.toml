[workspace]
resolver = "3"
members = ["bijoux", "bijoux_wasm"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inkandswitch/bijou"
authors = ["Brooklyn Zelenka <hello@brooklynzelenka.com>"]

[workspace.dependencies]
# Internal crates
bijoux = { version = "0.3", path = "bijoux", default-features = false }
bijoux_wasm = { version = "0.1", path = "bijoux_wasm", default-features = false }

# External crates
arbitrary = "1.4"
bolero = "0.13.4"
criterion = { version = "0.5", default-features = false }
criterion_pprof = { package = "pprof", version = "0.15", default-features = false, features = [
  "criterion",
  "flamegraph",
] }
js-sys = { version = "=0.3.104", default-features = false }
rand = { version = "0.8.5", default-features = false }
testresult = "0.4.1"
thiserror = { version = "2.0", default-features = false }
wasm-bindgen = { version = "=0.2.127", default-features = false }
wasm-bindgen-test = "0.3"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }

rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unused_extern_crates = "deny"

unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
fallible_impl_from = "warn"
fn_params_excessive_bools = "warn"
indexing_slicing = "warn"
missing_const_for_fn = "warn"
must_use_candidate = "warn"
panic = "warn"
todo = "warn"
unneeded_field_pattern = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
module_name_repetitions = "allow"            # deliberate: width-suffixed type names (u64::EncodedU64)
multiple_crate_versions = "allow"            # various transitive deps
pedantic = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
# Native/wasm-pack builds abort on panic. NOTE: wasm-bodge (`bodge`) builds
# override this to panic=unwind via -Zbuild-std so panics surface as
# catchable JS PanicErrors — see the `bodge` command in flake.nix.
panic = "abort"
strip = "symbols"

# Benchmarks: keep symbols and debug info for flamegraphs/profiling tools.
# Note: the bench profile inherits from release, so we override opt-level back
# to 3 for accurate native benchmark numbers.
[profile.bench]
codegen-units = 1
debug = true
lto = "thin"
opt-level = 3
strip = false

# Debug-oriented Wasm profile. Preserves full DWARF so Chrome DevTools
# (with the C/C++ DevTools Support extension) can step through.
#
# Built via: `bodge <crate>` / `bodge:all`, which pass
# `--debug-profile wasm-debug` to wasm-bodge. The debug variant is exposed
# through the `./debug` subpath exports of each `*_wasm` package.
#
# Tradeoff rationale vs. profile.release:
#
# | knob             | wasm-debug | release | why different             |
# |------------------|------------|---------|---------------------------|
# | opt-level        | 1          | 3       | preserve locals/stepping  |
# | lto              | "thin"     | "fat"   | keep stack frames clear   |
# | codegen-units    | 16         | 1       | faster rebuild cycle      |
# | debug            | "limited"  | (off)   | DWARF for step-through    |
# | strip            | "none"     | symbols | DWARF must survive        |
# | debug-assertions | true       | false   | catch bugs during debug   |
# | overflow-checks  | true       | false   | catch bugs during debug   |
# | panic            | abort*     | abort*  | (inherited)               |
# * wasm-bodge overrides both to panic=unwind at build time (see flake.nix).
#
# opt-level=1 is the Chrome-DevTools sweet spot: most locals remain visible,
# line stepping feels natural, and iterator chains don't fuse. wasm-opt is
# skipped by wasm-bodge for the debug variant (binaryen's DWARF support
# corrupts wasm-bindgen-emitted DWARF), so no additional knob here.
[profile.wasm-debug]
inherits = "release"
codegen-units = 16
debug = "limited"
debug-assertions = true
lto = "thin"
opt-level = 1
overflow-checks = true
strip = "none"

# The release profile strips symbols workspace-wide; we inherit from release,
# so re-enable DWARF retention for the Wasm-binding crate explicitly.
[profile.wasm-debug.package.bijoux_wasm]
strip = "none"
